name: Finalize performance phase 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/performance-phase2-finalize.yml

permissions:
  contents: write

concurrency:
  group: performance-phase-2-finalize
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the already-reviewed phase 2 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/performance-hotfix.yml').read_text(encoding='utf-8')
          opener = "          python - <<'PY'\n"
          closer = "\n          PY\n"
          start = source.index(opener) + len(opener)
          end = source.index(closer, start)
          patch = dedent(source[start:end])
          exec(compile(patch, 'performance-phase-2-patch.py', 'exec'), {})
          PY

      - name: Remove temporary migration machinery
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/performance-hotfix.yml \
            .github/workflows/performance-phase2-finalize.yml \
            scripts/apply-performance-hotfix.mjs \
            scripts/refine-performance-hotfix.mjs

      - name: Rebuild generated assets
        run: |
          pnpm build:ui-bundle
          pnpm generate:build-meta

      - name: Validate phase 2 contracts
        run: |
          pnpm exec eslint assets/js/app.js tests/unit/startup-performance-contract.test.mjs
          pnpm check:js
          pnpm check:ui
          pnpm check:startup-performance
          node --test \
            tests/unit/runtime-performance-metrics.test.mjs \
            tests/unit/surface-controller.test.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run relevant browser regressions
        run: |
          pnpm exec playwright test \
            tests/browser/mobile-sheet-gestures.spec.mjs \
            tests/browser/performance-observability.spec.mjs \
            tests/browser/renderer-responsiveness.spec.mjs

      - name: Commit and push phase 2
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf: keep mobile sheet motion on the compositor"
          git push origin HEAD:main
