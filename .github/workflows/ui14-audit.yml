name: UI14 architecture audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ui14-audit.yml
      - index.html
      - assets/js/app.js
      - assets/js/bootstrap.js
      - assets/css/tokens/**
      - assets/css/primitives/**
      - assets/css/components/**
      - assets/css/layout/**
      - assets/css/features/**
      - assets/css/utilities/**
      - assets/js/modules/ui-runtime.js
      - assets/js/modules/feedback-controller.js
      - assets/js/modules/mobile-sheet-controller.js
      - assets/js/modules/dialog-accessibility-controller.js
      - assets/js/modules/tool-controller.js
      - assets/js/modules/surface-controller.js
      - assets/js/modules/historical-library-controller.js
      - scripts/check-ui-architecture.mjs
      - scripts/check-ui-layering.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/bootstrap.js
          node --check assets/js/app.js
          node --check assets/js/modules/ui-runtime.js
          node --check assets/js/modules/feedback-controller.js
          node --check assets/js/modules/mobile-sheet-controller.js
          node --check assets/js/modules/dialog-accessibility-controller.js
          node --check assets/js/modules/tool-controller.js
          node --check assets/js/modules/surface-controller.js
          node --check assets/js/modules/historical-library-controller.js
      - name: Check UI architecture
        run: node scripts/check-ui-architecture.mjs
      - name: Check UI components
        run: node scripts/check-ui-components.mjs
      - name: Check UI layering
        run: node scripts/check-ui-layering.mjs
      - name: Check UI information architecture
        run: node scripts/check-ui-information-architecture.mjs
      - name: Check surface controller
        run: node --test tests/unit/surface-controller.test.mjs
