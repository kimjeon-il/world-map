name: Performance observability UI diagnostic

on:
  push:
    branches:
      - perf/phase1-observability

permissions:
  contents: write

concurrency:
  group: performance-observability-ui-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/phase1-observability
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild canonical UI bundle
        run: pnpm build:ui-bundle

      - name: Check all UI contracts
        run: pnpm check:ui

      - name: Refresh build metadata
        run: pnpm generate:build-meta

      - name: Commit generated repairs and remove diagnostic workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/performance-observability-ui-diagnostic.yml
          git add assets/css/ui-v2.bundle.css assets/js/build-meta.js index.html README.md
          git commit -m "chore: refresh UI bundle and observability build metadata"
          git push origin HEAD:perf/phase1-observability
