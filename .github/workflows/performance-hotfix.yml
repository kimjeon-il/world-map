name: Performance phase 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/performance-hotfix.yml

permissions:
  contents: write

concurrency:
  group: performance-phase-2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply compositor-only sheet drag and remove live blur
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  print(f'{path}: expected one replacement, found {count}; anchor={old[:100]!r}')
                  raise SystemExit(1)
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          app_path = 'assets/js/app.js'

          # Programmatic closes already pass through the settlement finalizer.


          helper_marker = '''  function beginMobileSheetDrag(panel, source, pointerId, clientY) {
          '''
          helper_block = '''  const mobileSheetSettlement = new WeakMap();

            function clearMobileSheetDragPresentation(panel) {
              if (!panel) return;
              const pending = mobileSheetSettlement.get(panel);
              if (pending?.timer) clearTimeout(pending.timer);
              mobileSheetSettlement.delete(panel);
              panel.classList.remove('is-sheet-dragging', 'is-sheet-settling');
              panel.style.removeProperty('--sheet-drag-height');
              panel.style.removeProperty('--sheet-drag-offset');
            }

            function applyMobileSheetDragPreview(panel, height) {
              const maxHeight = mobileSheetSnapHeight(SHEET_SNAP_RATIOS.length - 1, panel);
              const minHeight = mobileSheetSnapHeight(0, panel);
              const visibleHeight = clamp(Number(height) || 0, Math.max(128, minHeight * 0.62), maxHeight);
              panel.style.setProperty('--sheet-drag-height', `${Math.round(maxHeight)}px`);
              panel.style.setProperty('--sheet-drag-offset', `${Math.round(maxHeight - visibleHeight)}px`);
              return { visibleHeight, maxHeight };
            }

            function finalizeMobileSheetSettlement(panel) {
              const settlement = mobileSheetSettlement.get(panel);
              if (!settlement) return false;
              if (settlement.timer) clearTimeout(settlement.timer);
              mobileSheetSettlement.delete(panel);
              const { dismiss, restoreFocus } = settlement;
              panel.classList.remove('is-sheet-dragging', 'is-sheet-settling');
              panel.style.removeProperty('--sheet-drag-height');
              panel.style.removeProperty('--sheet-drag-offset');
              if (dismiss) {
                closeActiveMobileSheet({ restoreFocus });
                return true;
              }
              refreshMapSheetMetrics();
              requestAnimationFrame(syncMapHudBounds);
              queueMapResize('panel-layout');
              return true;
            }

            function settleMobileSheetDrag(panel, { targetIndex = null, dismiss = false, restoreFocus = false } = {}) {
              if (!panel) return;
              const previous = mobileSheetSettlement.get(panel);
              if (previous?.timer) clearTimeout(previous.timer);
              const maxHeight = mobileSheetSnapHeight(SHEET_SNAP_RATIOS.length - 1, panel);
              let targetOffset = maxHeight;
              if (!dismiss) {
                const safeTarget = clamp(Number(targetIndex) || 0, 0, SHEET_SNAP_RATIOS.length - 1);
                const targetHeight = setMobileSheetHeight(panel, safeTarget);
                targetOffset = Math.max(0, maxHeight - targetHeight);
              }
              const settlement = { dismiss, restoreFocus, timer: 0 };
              mobileSheetSettlement.set(panel, settlement);
              panel.classList.remove('is-sheet-dragging');
              panel.classList.add('is-sheet-settling');
              panel.style.setProperty('--sheet-drag-height', `${Math.round(maxHeight)}px`);
              requestAnimationFrame(() => {
                if (mobileSheetSettlement.get(panel) !== settlement) return;
                panel.style.setProperty('--sheet-drag-offset', `${Math.round(targetOffset)}px`);
              });
              settlement.timer = setTimeout(() => finalizeMobileSheetSettlement(panel), 280);
            }

          '''
          replace_once(app_path, helper_marker, helper_block + helper_marker)

          replace_once(
              app_path,
              '''  function beginMobileSheetDrag(panel, source, pointerId, clientY) {
              if (!isMobile() || !panel || activeSheetDrag) return false;
              const currentHeight = Number.parseFloat(getComputedStyle(panel).height)
                || setMobileSheetHeight(panel, sheetSnapIndex.get(panel.id) ?? MOBILE_SHEET_DEFAULT_SNAP);
              activeSheetDrag = {
                panel,
                source,
                pointerId,
                startY: clientY,
                startHeight: currentHeight,
                startIndex: sheetSnapIndex.get(panel.id) ?? MOBILE_SHEET_DEFAULT_SNAP,
                startTime: performance.now(),
                moved: false,
              };
              document.body.classList.add('map-sheet-dragging');
              return true;
            }
          ''',
              '''  function beginMobileSheetDrag(panel, source, pointerId, clientY) {
              if (!isMobile() || !panel || activeSheetDrag) return false;
              clearMobileSheetDragPresentation(panel);
              const currentHeight = Number.parseFloat(getComputedStyle(panel).height)
                || setMobileSheetHeight(panel, sheetSnapIndex.get(panel.id) ?? MOBILE_SHEET_DEFAULT_SNAP);
              const preview = applyMobileSheetDragPreview(panel, currentHeight);
              panel.classList.add('is-sheet-dragging');
              activeSheetDrag = {
                panel,
                source,
                pointerId,
                startY: clientY,
                startHeight: currentHeight,
                previewHeight: preview.visibleHeight,
                maxHeight: preview.maxHeight,
                startIndex: sheetSnapIndex.get(panel.id) ?? MOBILE_SHEET_DEFAULT_SNAP,
                startTime: performance.now(),
                moved: false,
              };
              document.body.classList.add('map-sheet-dragging');
              return true;
            }
          ''',
          )

          replace_once(
              app_path,
              '''  function moveMobileSheetDrag(panel, source, pointerId, clientY) {
              const drag = activeSheetDrag;
              if (!drag || drag.panel !== panel || drag.source !== source || drag.pointerId !== pointerId) return false;
              const deltaY = clientY - drag.startY;
              if (Math.abs(deltaY) > 6) drag.moved = true;
              setMobileSheetHeight(panel, drag.startIndex, drag.startHeight - deltaY);
              refreshMapSheetMetrics();
              queueMapResize('panel-layout');
              return true;
            }
          ''',
              '''  function moveMobileSheetDrag(panel, source, pointerId, clientY) {
              const drag = activeSheetDrag;
              if (!drag || drag.panel !== panel || drag.source !== source || drag.pointerId !== pointerId) return false;
              const deltaY = clientY - drag.startY;
              if (Math.abs(deltaY) > 6) drag.moved = true;
              const preview = applyMobileSheetDragPreview(panel, drag.startHeight - deltaY);
              drag.previewHeight = preview.visibleHeight;
              drag.maxHeight = preview.maxHeight;
              return true;
            }
          ''',
          )

          replace_once(
              app_path,
              '''  function finishMobileSheetDrag(panel, source, pointerId, clientY, { cancelled = false } = {}) {
              const drag = activeSheetDrag;
              if (!drag || drag.panel !== panel || drag.source !== source || drag.pointerId !== pointerId) return null;
              const deltaY = clientY - drag.startY;
              const currentHeight = Number.parseFloat(getComputedStyle(panel).height) || drag.startHeight;
              const elapsed = Math.max(1, performance.now() - drag.startTime);
              const velocity = deltaY / elapsed;
              activeSheetDrag = null;
              document.body.classList.remove('map-sheet-dragging');
              const dismissDistance = Math.min(180, drag.startHeight * 0.3);
              if (!cancelled && deltaY > 64 && (deltaY >= dismissDistance || velocity > 0.65)) {
                closeActiveMobileSheet({ restoreFocus: true });
              } else {
                let targetIndex = cancelled ? drag.startIndex : nearestSheetSnapIndex(currentHeight, panel);
                if (!cancelled && drag.moved && Math.abs(deltaY) > 24 && Math.abs(velocity) > 0.45) {
                  targetIndex = clamp(drag.startIndex + (deltaY < 0 ? 1 : -1), 0, SHEET_SNAP_RATIOS.length - 1);
                }
                if (!cancelled) sheetSnapTouched.add(panel.id);
                setMobileSheetHeight(panel, targetIndex);
                syncOverlayState();
              }
              return drag;
            }
          ''',
              '''  function finishMobileSheetDrag(panel, source, pointerId, clientY, { cancelled = false } = {}) {
              const drag = activeSheetDrag;
              if (!drag || drag.panel !== panel || drag.source !== source || drag.pointerId !== pointerId) return null;
              const deltaY = clientY - drag.startY;
              const currentHeight = Number(drag.previewHeight || drag.startHeight);
              const elapsed = Math.max(1, performance.now() - drag.startTime);
              const velocity = deltaY / elapsed;
              activeSheetDrag = null;
              document.body.classList.remove('map-sheet-dragging');
              const dismissDistance = Math.min(180, drag.startHeight * 0.3);
              if (!cancelled && deltaY > 64 && (deltaY >= dismissDistance || velocity > 0.65)) {
                settleMobileSheetDrag(panel, { dismiss: true, restoreFocus: true });
              } else {
                let targetIndex = cancelled ? drag.startIndex : nearestSheetSnapIndex(currentHeight, panel);
                if (!cancelled && drag.moved && Math.abs(deltaY) > 24 && Math.abs(velocity) > 0.45) {
                  targetIndex = clamp(drag.startIndex + (deltaY < 0 ? 1 : -1), 0, SHEET_SNAP_RATIOS.length - 1);
                }
                if (!cancelled) sheetSnapTouched.add(panel.id);
                settleMobileSheetDrag(panel, { targetIndex });
              }
              return drag;
            }
          ''',
          )

          surfaces = Path('assets/css/layout/surfaces.css')
          text = surfaces.read_text(encoding='utf-8')
          marker = '''[data-layout="mobile"] .workspace-surface.mobile-open {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
          }
          '''
          addition = marker + '''
          [data-layout="mobile"] .workspace-surface.mobile-open:is(.is-sheet-dragging, .is-sheet-settling) {
            height: var(--sheet-drag-height, var(--sheet-height));
            transform: translate3d(0, var(--sheet-drag-offset, 0px), 0);
          }

          [data-layout="mobile"] .workspace-surface.is-sheet-dragging {
            transition: none;
            will-change: transform;
          }

          [data-layout="mobile"] .workspace-surface.is-sheet-settling {
            will-change: transform;
          }
          '''
          if text.count(marker) != 1:
              raise SystemExit(f'{surfaces}: mobile-open marker count {text.count(marker)}')
          surfaces.write_text(text.replace(marker, addition, 1), encoding='utf-8')

          editor_shell = Path('assets/css/components/editor-shell.css')
          text = editor_shell.read_text(encoding='utf-8')
          old_topbar = '''  background: var(--surface-topbar);
            backdrop-filter: blur(18px) saturate(1.08);
          '''
          old_panels = '''  box-shadow: none;
            backdrop-filter: blur(18px);
          '''
          if text.count(old_topbar) != 1 or text.count(old_panels) != 1:
              raise SystemExit('editor-shell blur markers changed unexpectedly')
          text = text.replace(
              old_topbar,
              '''  background: var(--surface-topbar);
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
          ''',
              1,
          )
          text = text.replace(
              old_panels,
              '''  box-shadow: none;
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
          ''',
              1,
          )
          if 'backdrop-filter: blur(' in text:
              raise SystemExit('editor-shell.css still contains live backdrop blur')
          editor_shell.write_text(text, encoding='utf-8')

          test_path = Path('tests/unit/startup-performance-contract.test.mjs')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              "const bundle = read('assets/css/ui-v2.bundle.css');\n",
              "const bundle = read('assets/css/ui-v2.bundle.css');\nconst surfaces = read('assets/css/layout/surfaces.css');\nconst editorShell = read('assets/css/components/editor-shell.css');\n",
              1,
          )
          contract = r'''

          test('mobile sheet drag stays compositor-only until snap settlement', () => {
            const moveStart = app.indexOf('function moveMobileSheetDrag');
            const moveEnd = app.indexOf('function finishMobileSheetDrag', moveStart);
            const moveSource = app.slice(moveStart, moveEnd);
            assert.ok(moveStart >= 0 && moveEnd > moveStart);
            assert.match(moveSource, /applyMobileSheetDragPreview/);
            assert.doesNotMatch(moveSource, /setMobileSheetHeight|refreshMapSheetMetrics|queueMapResize/);
            assert.match(app, /function finalizeMobileSheetSettlement/);
            assert.match(surfaces, /\.workspace-surface\.mobile-open:is\(\.is-sheet-dragging, \.is-sheet-settling\)/);
            assert.match(surfaces, /transform: translate3d\(0, var\(--sheet-drag-offset, 0px\), 0\)/);
            assert.match(surfaces, /\.workspace-surface\.is-sheet-dragging[\s\S]*transition: none/);
          });

          test('map chrome avoids live backdrop blur over animated map content', () => {
            assert.doesNotMatch(editorShell, /(?:-webkit-)?backdrop-filter:\s*blur\(/);
            assert.match(editorShell, /\.topbar[\s\S]*backdrop-filter: none/);
            assert.match(editorShell, /\[data-layout="wide"\] \.left-panel,[\s\S]*backdrop-filter: none/);
          });
          '''
          if 'mobile sheet drag stays compositor-only until snap settlement' in test_text:
              raise SystemExit('phase 2 performance contract already exists')
          test_path.write_text(test_text.rstrip() + contract, encoding='utf-8')
          PY

      - name: Remove retired one-shot hotfix machinery
        run: |
          git rm -f --ignore-unmatch .github/workflows/performance-hotfix.yml
          git rm -f --ignore-unmatch scripts/apply-performance-hotfix.mjs scripts/refine-performance-hotfix.mjs

      - name: Rebuild generated assets
        run: |
          pnpm build:ui-bundle
          pnpm generate:build-meta

      - name: Validate runtime and performance contracts
        run: |
          pnpm exec eslint assets/js/app.js tests/unit/startup-performance-contract.test.mjs
          pnpm check:js
          pnpm check:ui
          pnpm check:startup-performance
          pnpm test:unit

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run mobile and observability browser regressions
        run: |
          pnpm exec playwright test \
            tests/browser/mobile-sheet-gestures.spec.mjs \
            tests/browser/performance-observability.spec.mjs \
            tests/browser/renderer-responsiveness.spec.mjs

      - name: Commit and push phase 2
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf: keep mobile sheet motion on the compositor"
          git push origin HEAD:main
