name: Performance hotfix diagnostic
# validation-attempt: 7

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/performance-hotfix.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile >/dev/null
      - name: Materialize validation workspace
        run: |
          node scripts/apply-performance-hotfix.mjs >/dev/null
          node scripts/refine-performance-hotfix.mjs >/dev/null
          pnpm build:ui-bundle >/dev/null
          pnpm check:architecture >/tmp/architecture.log 2>&1 || true
      - name: Print cache contract test only
        run: |
          echo '=== CACHE CONTRACT TEST BEGIN ==='
          if [ -f tests/unit/data-loader-worker-cache.test.mjs ]; then
            cat tests/unit/data-loader-worker-cache.test.mjs
          else
            echo 'MISSING'
            find tests/unit -maxdepth 1 -type f -name '*loader*' -print
          fi
          echo '=== CACHE CONTRACT TEST END ==='
