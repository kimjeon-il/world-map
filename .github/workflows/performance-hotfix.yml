name: Performance hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/performance-hotfix.yml

permissions:
  contents: write

concurrency:
  group: performance-hotfix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply performance fixes
        run: node scripts/apply-performance-hotfix.mjs

      - name: Rebuild canonical UI bundle
        run: pnpm build:ui-bundle

      - name: Validate changed runtime
        run: |
          pnpm exec eslint assets/js/bootstrap.js assets/js/modules/ui-runtime.js assets/js/workers/data-loader-worker.js scripts/check-object-registry.mjs scripts/check-ui-layering.mjs tests/unit/startup-performance-contract.test.mjs
          pnpm check:js
          pnpm check:ui
          pnpm check:architecture
          node --test tests/unit/startup-performance-contract.test.mjs tests/unit/surface-controller.test.mjs tests/unit/map-render-coordinator.test.mjs

      - name: Commit performance fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html assets/css/components/editor-shell.css assets/css/ui-v2.bundle.css assets/js/app.js assets/js/bootstrap.js assets/js/modules/ui-runtime.js assets/js/workers/data-loader-worker.js scripts/check-ui-layering.mjs tests/unit/startup-performance-contract.test.mjs
          git commit -m "perf: restore fast startup and smooth map chrome"

      - name: Refresh build metadata
        run: |
          pnpm generate:build-meta
          git add assets/js/build-meta.js index.html README.md
          git commit -m "chore: refresh performance hotfix metadata"

      - name: Final contract checks
        run: |
          pnpm check:js
          pnpm check:ui
          pnpm check:architecture
          pnpm test:unit

      - name: Push fixes
        run: git push origin HEAD:main
